name: Node.js CI (Backend Deploy)

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: './neva-backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./neva-backend
        run: npm ci

      - name: Create production environment file
        working-directory: ./neva-backend
        run: |
          cat << 'EOF' > .env
          ${{ secrets.PROD_ENV_FILE }}
          EOF

      - name: Restart Backend Server
        working-directory: ./neva-backend
        run: |
          # PM2 server ko restart karne ki command (taaki nayi .env keys load ho jayein)
          pm2 restart all
